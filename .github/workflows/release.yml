# Builds, signs, notarizes and packages on a version tag, then attaches the
# files to a draft GitHub release for a person to review and publish.
#
# Repository secrets:
#   DEVELOPER_ID_P12        Base64 of the Developer ID Application .p12
#   DEVELOPER_ID_PASSWORD   Its password
#   NOTARY_KEY_P8           Base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID           The key's ID
#   NOTARY_ISSUER_ID        Its issuer ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          source_version="$(sed -n 's/.*static let current = "\(.*\)"/\1/p' Sources/HarmuneCore/Paths.swift)"
          if [ "$version" != "$source_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $source_version in Paths.swift"
            exit 1
          fi
          if ! grep -q "^## $version\( \|$\)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          if ! grep -q '"Developer ID Application: ' <<<"$identities"; then
            echo "::error::DEVELOPER_ID_P12 has no Developer ID Application identity. It contains:"
            sed -n 's/.*"\(.*\)"/  \1/p' <<<"$identities"
            exit 1
          fi
          # Sign with exactly this identity, never a fallback.
          echo "HARMUNE_SIGN_IDENTITY=$(sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' <<<"$identities" | head -1)" >> "$GITHUB_ENV"

      - name: Build and sign
        run: Scripts/build-host.sh

      - name: Notarize
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool store-credentials harmune-ci --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          rm "$RUNNER_TEMP/key.p8"
          Scripts/notarize.sh harmune-ci

      - name: Package
        run: Scripts/package.sh

      - name: Generate and verify the Homebrew cask
        run: |
          Scripts/render-cask.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > build/release/harmune.rb
          version="${GITHUB_REF_NAME#v}"
          archive="$PWD/build/release/Harmune-$version-arm64.zip"
          smoke="$(mktemp -d "$RUNNER_TEMP/harmune-cask.XXXXXX")"
          # Test through a temporary tap using the archive before it is public.
          mkdir -p "$smoke/tap/Casks"
          sed 's|^  url .*|  url "file://'"$archive"'"|' build/release/harmune.rb > "$smoke/tap/Casks/harmune.rb"
          git -C "$smoke/tap" init -q
          git -C "$smoke/tap" add Casks
          git -C "$smoke/tap" -c user.name=Harmune -c user.email=ci@example.invalid commit -qm "Test cask"
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap harmune-ci/smoke "$smoke/tap"
          brew install --cask --appdir "$smoke/Applications" harmune-ci/smoke/harmune
          launcher="$(brew --prefix)/bin/harmune"
          test -L "$launcher"
          test "$launcher" -ef "$smoke/Applications/Harmune.app/Contents/Resources/bin/harmune"
          test "$(command -v harmune)" -ef "$launcher"
          test "$(harmune --version)" = "harmune $version"

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/* --draft --generate-notes
